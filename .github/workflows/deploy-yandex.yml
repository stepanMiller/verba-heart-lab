name: Deploy V2 to Yandex Object Storage

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yandex-production
  cancel-in-progress: true

env:
  BUCKET_NAME: verba-heart
  S3_ENDPOINT: https://storage.yandexcloud.net
  AWS_DEFAULT_REGION: ru-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build root-path static export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ""
        run: npm run build:pages

      - name: Install AWS CLI
        run: python3 -m pip install --user awscli

      - name: Deploy canonical root to Yandex Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
        run: |
          aws s3 rm "s3://${BUCKET_NAME}/index.html" \
            --endpoint-url "${S3_ENDPOINT}" \
            --no-progress || true

          aws s3 sync out/ "s3://${BUCKET_NAME}/" \
            --endpoint-url "${S3_ENDPOINT}" \
            --delete \
            --exclude "media/*" \
            --no-progress

          aws s3 cp out/ "s3://${BUCKET_NAME}/" \
            --endpoint-url "${S3_ENDPOINT}" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-store, no-cache, must-revalidate, max-age=0" \
            --expires "Thu, 01 Jan 1970 00:00:00 GMT" \
            --content-type "text/html; charset=utf-8" \
            --no-progress

          aws s3 cp out/index.html "s3://${BUCKET_NAME}/index.html" \
            --endpoint-url "${S3_ENDPOINT}" \
            --cache-control "no-store, no-cache, must-revalidate, max-age=0" \
            --expires "Thu, 01 Jan 1970 00:00:00 GMT" \
            --content-type "text/html; charset=utf-8" \
            --no-progress

      - name: Stage VERBA intro film into persistent media
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
        run: |
          curl -L --fail --retry 3 \
            "https://d2jqrm6oza8nb6.cloudfront.net/datasets/7425f1a6-f0de-461b-8aec-1c6ceaf21067.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZGFlN2RmYzcyNGI2M2VkMiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTEwOTE5MX0.VblLe0WzUvM9Xx217-8hAZ5-ncF82nupph2BMOzvEhs" \
            -o /tmp/VERBA-Heart-Review-v02.mp4

          test -s /tmp/VERBA-Heart-Review-v02.mp4

          aws s3 cp /tmp/VERBA-Heart-Review-v02.mp4 \
            "s3://${BUCKET_NAME}/media/VERBA-Heart-Review-v02.mp4" \
            --endpoint-url "${S3_ENDPOINT}" \
            --content-type "video/mp4" \
            --cache-control "public, max-age=86400" \
            --no-progress

      - name: Build immutable release
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          BASE_PATH="/release-${SHORT_SHA}"
          rm -rf .next out
          GITHUB_PAGES="true" NEXT_PUBLIC_BASE_PATH="${BASE_PATH}" npm run build:pages
          echo "RELEASE_PATH=${BASE_PATH}" >> "$GITHUB_ENV"

      - name: Deploy immutable release
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
        run: |
          aws s3 sync out/ "s3://${BUCKET_NAME}${RELEASE_PATH}/" \
            --endpoint-url "${S3_ENDPOINT}" \
            --delete \
            --no-progress

          aws s3 cp out/ "s3://${BUCKET_NAME}${RELEASE_PATH}/" \
            --endpoint-url "${S3_ENDPOINT}" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-store, no-cache, must-revalidate, max-age=0" \
            --expires "Thu, 01 Jan 1970 00:00:00 GMT" \
            --content-type "text/html; charset=utf-8" \
            --no-progress

      - name: Deployment URL
        run: |
          echo "Canonical: https://verba-heart.website.yandexcloud.net" >> "$GITHUB_STEP_SUMMARY"
          echo "Intro: https://verba-heart.website.yandexcloud.net/media/VERBA-Heart-Review-v02.mp4" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable release: https://verba-heart.website.yandexcloud.net${RELEASE_PATH}/" >> "$GITHUB_STEP_SUMMARY"
