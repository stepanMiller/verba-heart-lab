name: Deploy V2 to Yandex Object Storage

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yandex-production
  cancel-in-progress: true

env:
  BUCKET_NAME: verba-heart
  S3_ENDPOINT: https://storage.yandexcloud.net
  AWS_DEFAULT_REGION: ru-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build root-path static export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ""
        run: npm run build:pages

      - name: Install AWS CLI
        run: python3 -m pip install --user awscli

      - name: Deploy canonical root to Yandex Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
        run: |
          # Remove the old entry document first so the website endpoint cannot
          # keep serving the previous ETag while the rest of the build changes.
          aws s3 rm "s3://${BUCKET_NAME}/index.html" \
            --endpoint-url "${S3_ENDPOINT}" \
            --no-progress || true

          aws s3 sync out/ "s3://${BUCKET_NAME}/" \
            --endpoint-url "${S3_ENDPOINT}" \
            --delete \
            --no-progress

          # HTML must always revalidate. Hashed Next assets can keep their
          # default metadata; only entry documents are forced to no-store.
          aws s3 cp out/ "s3://${BUCKET_NAME}/" \
            --endpoint-url "${S3_ENDPOINT}" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-store, no-cache, must-revalidate, max-age=0" \
            --expires "Thu, 01 Jan 1970 00:00:00 GMT" \
            --content-type "text/html; charset=utf-8" \
            --no-progress

          # Upload the root entry document one final time with explicit
          # metadata after the sync. This is the canonical public URL.
          aws s3 cp out/index.html "s3://${BUCKET_NAME}/index.html" \
            --endpoint-url "${S3_ENDPOINT}" \
            --cache-control "no-store, no-cache, must-revalidate, max-age=0" \
            --expires "Thu, 01 Jan 1970 00:00:00 GMT" \
            --content-type "text/html; charset=utf-8" \
            --no-progress

      - name: Build immutable release
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          BASE_PATH="/release-${SHORT_SHA}"
          rm -rf .next out
          GITHUB_PAGES="true" NEXT_PUBLIC_BASE_PATH="${BASE_PATH}" npm run build:pages
          echo "RELEASE_PATH=${BASE_PATH}" >> "$GITHUB_ENV"

      - name: Deploy immutable release
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
        run: |
          aws s3 sync out/ "s3://${BUCKET_NAME}${RELEASE_PATH}/" \
            --endpoint-url "${S3_ENDPOINT}" \
            --delete \
            --no-progress

          aws s3 cp out/ "s3://${BUCKET_NAME}${RELEASE_PATH}/" \
            --endpoint-url "${S3_ENDPOINT}" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-store, no-cache, must-revalidate, max-age=0" \
            --expires "Thu, 01 Jan 1970 00:00:00 GMT" \
            --content-type "text/html; charset=utf-8" \
            --no-progress

      - name: Deployment URL
        run: |
          echo "Canonical: https://verba-heart.website.yandexcloud.net" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable release: https://verba-heart.website.yandexcloud.net${RELEASE_PATH}/" >> "$GITHUB_STEP_SUMMARY"
