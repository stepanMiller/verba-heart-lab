name: Build static site for Yandex Cloud

on:
  push:
    branches: [yandex-hosting]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Yandex migration branch
        uses: actions/checkout@v4
        with:
          ref: yandex-hosting

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build root-path static export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ""
        run: npm run build:pages

      - name: Prepare site and upload package
        run: |
          rm -rf /tmp/yandex-site
          mkdir -p /tmp/yandex-site
          cp -R out/. /tmp/yandex-site/
          cd /tmp/yandex-site
          zip -qr /tmp/VERBA-Heart-Yandex-Upload.zip .
          cd "$GITHUB_WORKSPACE"

      - name: Publish generated site to yandex-static branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan yandex-static
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/yandex-site/. .
          touch .nojekyll
          git add -A
          git commit -m "Build static site for Yandex Cloud"
          git push --force origin HEAD:yandex-static

      - name: Publish one-click ZIP to yandex-package branch
        run: |
          git checkout --orphan yandex-package
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/VERBA-Heart-Yandex-Upload.zip ./VERBA-Heart-Yandex-Upload.zip
          git add VERBA-Heart-Yandex-Upload.zip
          git commit -m "Package static site for Yandex Cloud upload"
          git push --force origin HEAD:yandex-package
