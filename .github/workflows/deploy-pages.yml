name: Publish VERBA Heart Lab V2 to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  publish-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 source
        uses: actions/checkout@v4
        with:
          ref: v2
          path: source

      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install V2 dependencies
        working-directory: source
        run: npm install --no-audit --no-fund

      - name: Build V2
        working-directory: source
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /verba-heart-lab/v2
        run: npm run build:pages

      - name: Replace only V2 in published site
        run: |
          rm -rf published/v2
          mkdir -p published/v2
          cp -R source/out/. published/v2/
          touch published/.nojekyll

      - name: Publish V2
        working-directory: published
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2 .nojekyll
          if git diff --cached --quiet; then
            echo "V2 is already up to date."
            exit 0
          fi
          git commit -m "Publish VERBA Heart Lab V2"
          git push origin gh-pages
