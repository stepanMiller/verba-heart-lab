name: Deploy VERBA Heart Lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable V1
        uses: actions/checkout@v4
        with:
          ref: main
          path: v1

      - name: Checkout V2
        uses: actions/checkout@v4
        with:
          ref: v2
          path: v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install V1 dependencies
        working-directory: v1
        run: npm install --no-audit --no-fund

      - name: Build stable V1
        working-directory: v1
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /verba-heart-lab
        run: npm run build:pages

      - name: Install V2 dependencies
        working-directory: v2
        run: npm install --no-audit --no-fund

      - name: Build V2
        working-directory: v2
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /verba-heart-lab/v2
        run: npm run build:pages

      - name: Assemble V1 and V2
        run: |
          mkdir -p site/v2
          cp -R v1/out/. site/
          cp -R v2/out/. site/v2/

      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
